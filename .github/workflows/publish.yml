name: publish

# 只有一个入口：推 tag。release 和手动触发都曾是触发器，但它们会在同一个版本
# 上再跑一遍发布，被 npm 以「版本已存在」拒绝 —— 一次发版一条路径。
on:
  push:
    tags: ['v*']

permissions:
  contents: write # 建 release 要写仓库内容
  id-token: write # trusted publishing 通过 OIDC 认证，必须给这个权限

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 读 tag 注解需要完整历史

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      # trusted publishing 需要 npm 11.5.1 以上
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: npm publish --provenance --access public

      # tag 注解里的更新说明直接成为 Release 正文；没写注解就让 GitHub 从提交
      # 记录生成。已经存在就不动，重跑一次发版不会因为 Release 报错。
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists, leaving it alone"
            exit 0
          fi
          notes=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")
          if [ -z "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$notes"
          fi
