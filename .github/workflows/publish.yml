name: publish

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # trusted publishing 通过 OIDC 认证，必须给这个权限

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      # trusted publishing 需要 npm 11.5.1 以上
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: npm publish --provenance --access public
