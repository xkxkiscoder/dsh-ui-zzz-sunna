name: publish

# 只有一个入口：推 tag。release 和手动触发都曾是触发器，但它们会在同一个版本
# 上再跑一遍发布，被 npm 以「版本已存在」拒绝 —— 一次发版一条路径。
on:
  push:
    tags: ['v*']

# 同一个 ref 的并发 run 排队而不是并行。真正兜底的是下面 Publish 里的已发布
# 检查：同一次 tag push 有时会投递出两个 run，谁先谁后都不该让另一个报错。
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # 建 release 要写仓库内容
  id-token: write # trusted publishing 通过 OIDC 认证，必须给这个权限

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      # trusted publishing 需要 npm 11.5.1 以上
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

      # 版本已在 registry 上就当成功返回：重复投递的第二个 run 不该失败。
      - name: Publish
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "dsh-ui-zzz-sunna@$version" version >/dev/null 2>&1; then
            echo "dsh-ui-zzz-sunna@$version is already published, skipping"
          else
            npm publish --provenance --access public
          fi

      # Release 正文取自 CHANGELOG.md 里 `## [<版本>]` 那一段，所以更新说明只有
      # 一处来源；没写就让 GitHub 从提交记录生成。已存在就不动。
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists, leaving it alone"
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          notes=$(awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$notes"
          fi
