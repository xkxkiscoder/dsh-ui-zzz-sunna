name: publish

# 只有一个入口：推 tag。release 和手动触发都曾是触发器，但它们会在同一个版本
# 上再跑一遍发布，被 npm 以「版本已存在」拒绝 —— 一次发版一条路径。
on:
  push:
    tags: ['v*']

permissions:
  contents: write # 建 release 要写仓库内容
  id-token: write # trusted publishing 通过 OIDC 认证，必须给这个权限

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      # trusted publishing 需要 npm 11.5.1 以上
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: npm publish --provenance --access public

      # Release 正文取自 CHANGELOG.md 里 `## [<版本>]` 那一段，所以更新说明只有
      # 一处来源；没写就让 GitHub 从提交记录生成。已存在就不动，重跑不会报错。
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists, leaving it alone"
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          notes=$(awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$notes"
          fi
